<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刮刮樂遊戲</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}

#money, #record {
  font-size: 20px;
  margin-bottom: 10px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  font-size: 16px;
}

#scratchArea {
  width: 300px;
  height: 150px;
  margin: 20px auto;
  position: relative;
  display: none;
}

#result {
  width: 300px;
  height: 150px;
  line-height: 150px;
  font-size: 28px;
  background: white;
  border: 2px solid #333;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
}

#nextBtn, #autoBtn {
  display: none;
}
</style>
</head>

<body>

<h1>🎫 刮刮樂遊戲</h1>

<div id="money">💰 目前金幣：600</div>
<div id="record">🏆 最高紀錄：600</div>

<div id="shop">
  <button onclick="buyTicket(100)">100 元</button>
  <button onclick="buyTicket(200)">200 元</button>
  <button onclick="buyTicket(300)">300 元</button>
</div>

<div id="scratchArea">
  <div id="result"></div>
  <canvas id="canvas" width="300" height="150"></canvas>
</div>

<button id="nextBtn" onclick="nextTicket()">下一張</button>
<button id="autoBtn" onclick="autoPick()">🎲 幫我選一張</button>

<script>
/* ===== 金錢與最高紀錄 ===== */
let money = 600;
let record = Number(localStorage.getItem("highestRecord")) || money;

const moneyDiv = document.getElementById("money");
const recordDiv = document.getElementById("record");

/* ===== 遊戲資料 ===== */
let isScratching = false;
const prices = [100, 200, 300];

const outcomes = [
  { text: "銘謝惠顧", value: 0 },
  { text: "100 元", value: 100 },
  { text: "200 元", value: 200 },
  { text: "500 元", value: 500 }
];

const scratchArea = document.getElementById("scratchArea");
const resultDiv = document.getElementById("result");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const nextBtn = document.getElementById("nextBtn");
const autoBtn = document.getElementById("autoBtn");
const shop = document.getElementById("shop");

/* ===== 更新金錢與最高紀錄 ===== */
function updateMoney() {
  moneyDiv.textContent = "💰 目前金幣：" + money;

  if (money > record) {
    record = money;
    localStorage.setItem("highestRecord", record);
  }

  recordDiv.textContent = "🏆 最高紀錄：" + record;
}

/* ===== 刮刮層 ===== */
function drawCover() {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#999";
  ctx.fillRect(0, 0, 300, 150);
  ctx.fillStyle = "#fff";
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.fillText("刮開看看！", 150, 80);
}

/* ===== 買票 ===== */
function buyTicket(price) {
  if (money < price) {
    alert("金幣不足");
    return;
  }

  money -= price;
  updateMoney();

  const outcome = outcomes[Math.floor(Math.random() * outcomes.length)];
  resultDiv.textContent = outcome.text;

  scratchArea.style.display = "block";
  nextBtn.style.display = "none";
  autoBtn.style.display = "none";
  shop.style.pointerEvents = "none";

  drawCover();
  let revealed = false;

  function check() {
    const img = ctx.getImageData(0, 0, 300, 150).data;
    let clear = 0;
    for (let i = 3; i < img.length; i += 4) {
      if (img[i] === 0) clear++;
    }
    if (clear > img.length / 6 && !revealed) {
      revealed = true;
      money += outcome.value;
      updateMoney();
      nextBtn.style.display = "inline-block";
    }
  }

  canvas.onmousedown = () => isScratching = true;
  canvas.onmouseup = () => isScratching = false;
  canvas.onmousemove = e => {
    if (!isScratching) return;
    ctx.globalCompositeOperation = "destination-out";
    ctx.beginPath();
    ctx.arc(e.offsetX, e.offsetY, 15, 0, Math.PI * 2);
    ctx.fill();
    check();
  };
}

/* ===== 下一張 ===== */
function nextTicket() {
  scratchArea.style.display = "none";
  nextBtn.style.display = "none";
  resultDiv.textContent = "";
  ctx.clearRect(0, 0, 300, 150);
  shop.style.pointerEvents = "auto";
  autoBtn.style.display = "inline-block";
}

/* ===== 幫我選一張 ===== */
function autoPick() {
  autoBtn.style.display = "none";
  const price = prices[Math.floor(Math.random() * prices.length)];
  buyTicket(price);
}

/* 初始化 */
updateMoney();
</script>

</body>
</html>
