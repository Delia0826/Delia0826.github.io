<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>刮刮樂遊戲</title>

<style>
body {
  font-family: Arial;
  background: #f2f2f2;
  text-align: center;
  padding: 20px;
}

#money {
  font-size: 20px;
  margin-bottom: 10px;
}

#player {
  font-size: 18px;
  margin-bottom: 20px;
}

button {
  padding: 10px 15px;
  margin: 5px;
  font-size: 16px;
}

#scratchArea {
  width: 300px;
  height: 150px;
  margin: 20px auto;
  position: relative;
  display: none;
}

#result {
  width: 300px;
  height: 150px;
  line-height: 150px;
  font-size: 28px;
  background: white;
  border: 2px solid #333;
}

canvas {
  position: absolute;
  top: 0;
  left: 0;
}

#nextBtn, #autoBtn {
  display: none;
}

/* 排行榜 */
#leaderboard {
  width: 300px;
  margin: 30px auto;
  background: #fff;
  border: 2px solid #333;
  padding: 10px;
}

#leaderboard h2 {
  margin: 5px 0 10px;
}

#leaderboard ol {
  padding-left: 20px;
  text-align: left;
}
</style>
</head>

<body>

<h1>🎫 刮刮樂遊戲</h1>

<div id="player"></div>
<div id="money">💰 金幣：600</div>

<div id="shop">
  <button onclick="buyTicket(100)">100 元</button>
  <button onclick="buyTicket(200)">200 元</button>
  <button onclick="buyTicket(300)">300 元</button>
</div>

<div id="scratchArea">
  <div id="result"></div>
  <canvas id="canvas" width="300" height="150"></canvas>
</div>

<button id="nextBtn" onclick="nextTicket()">下一張</button>
<button id="autoBtn" onclick="autoPick()">🎲 幫我選一張</button>

<!-- 排行榜 -->
<div id="leaderboard">
  <h2>🏆 排行榜</h2>
  <ol id="rankList"></ol>
</div>

<script>
/* ===== 玩家名稱 ===== */
let playerName = "";
while(!playerName){
  playerName = prompt("請輸入你的玩家名稱：");
}
document.getElementById("player").textContent = "👤 玩家：" + playerName;

/* ===== 排行榜資料 ===== */
let leaderboard = [];

/* ===== 遊戲資料 ===== */
let money = 600;
let isScratching = false;
const prices = [100, 200, 300];

const outcomes = [
  {text:"銘謝惠顧", value:0},
  {text:"100 元", value:100},
  {text:"200 元", value:200},
  {text:"500 元", value:500}
];

const moneyDiv = document.getElementById("money");
const scratchArea = document.getElementById("scratchArea");
const resultDiv = document.getElementById("result");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const nextBtn = document.getElementById("nextBtn");
const autoBtn = document.getElementById("autoBtn");
const shop = document.getElementById("shop");
const rankList = document.getElementById("rankList");

/* ===== 更新金幣 ===== */
function updateMoney(){
  moneyDiv.textContent = "💰 金幣：" + money;
  updateLeaderboard();
}

/* ===== 排行榜更新 ===== */
function updateLeaderboard(){
  const existing = leaderboard.find(p => p.name === playerName);
  if(existing){
    existing.money = money;
  } else {
    leaderboard.push({name: playerName, money});
  }

  leaderboard.sort((a,b)=>b.money - a.money);

  rankList.innerHTML = "";
  leaderboard.forEach(p=>{
    const li = document.createElement("li");
    li.textContent = `${p.name} - ${p.money} 💰`;
    rankList.appendChild(li);
  });
}

/* ===== 刮刮層 ===== */
function drawCover(){
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#999";
  ctx.fillRect(0,0,300,150);
  ctx.fillStyle = "#fff";
  ctx.font = "20px Arial";
  ctx.textAlign = "center";
  ctx.fillText("刮開看看！",150,80);
}

/* ===== 買票 ===== */
function buyTicket(price){
  if(money < price){
    alert("金幣不足");
    return;
  }

  money -= price;
  updateMoney();

  const outcome = outcomes[Math.floor(Math.random()*outcomes.length)];
  resultDiv.textContent = outcome.text;

  scratchArea.style.display = "block";
  nextBtn.style.display = "none";
  autoBtn.style.display = "none";
  shop.style.pointerEvents = "none";

  drawCover();

  let revealed = false;

  function check(){
    const img = ctx.getImageData(0,0,300,150).data;
    let clear = 0;
    for(let i=3;i<img.length;i+=4){
      if(img[i]===0) clear++;
    }
    if(clear > img.length/6 && !revealed){
      revealed = true;
      money += outcome.value;
      updateMoney();
      nextBtn.style.display = "inline-block";
    }
  }

  canvas.onmousedown = ()=>isScratching=true;
  canvas.onmouseup = ()=>isScratching=false;
  canvas.onmousemove = e=>{
    if(!isScratching) return;
    ctx.globalCompositeOperation="destination-out";
    ctx.beginPath();
    ctx.arc(e.offsetX,e.offsetY,15,0,Math.PI*2);
    ctx.fill();
    check();
  };
}

/* ===== 下一張 ===== */
function nextTicket(){
  scratchArea.style.display="none";
  nextBtn.style.display="none";
  resultDiv.textContent="";
  ctx.clearRect(0,0,300,150);
  shop.style.pointerEvents="auto";
  autoBtn.style.display="inline-block";
}

/* ===== 幫我選一張 ===== */
function autoPick(){
  autoBtn.style.display="none";
  const price = prices[Math.floor(Math.random()*prices.length)];
  buyTicket(price);
}

/* 初始化排行榜 */
updateLeaderboard();
</script>

</body>
</html>
